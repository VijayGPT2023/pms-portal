{% extends "base.html" %}
{% block title %}Change Password - PMS Portal{% endblock %}

{% block content %}
<div class="page-container" style="max-width:520px; margin:0 auto; padding:20px;">
    <header style="margin-bottom:20px;">
        <h1 style="margin:0; font-size:24px;">Change Password</h1>
    </header>

    {% if error %}<div class="alert" style="padding:10px; border-radius:4px; background:#fef2f2; border:1px solid #fecaca; margin-bottom:16px;">{{ error }}</div>{% endif %}
    {% if messages %}
    <div class="messages" style="margin-bottom:16px;">
        {% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }}" style="padding:10px; border-radius:4px; background:#fff3cd; border:1px solid #ffeaa7;">{{ message }}</div>{% endfor %}
    </div>
    {% endif %}

    <form method="post" action="{% url 'core:change_password_submit' %}" class="card" style="padding:16px; border:1px solid #e5e7eb; border-radius:8px;">
        {% csrf_token %}
        <div style="margin-bottom:14px;">
            <label style="display:block; font-weight:600; margin-bottom:4px;">Current Password *</label>
            <input type="password" name="current_password" required style="width:100%; padding:8px;">
        </div>
        <div style="margin-bottom:14px;">
            <label style="display:block; font-weight:600; margin-bottom:4px;">New Password *</label>
            <input type="password" name="new_password" required style="width:100%; padding:8px;">
        </div>
        <div style="margin-bottom:18px;">
            <label style="display:block; font-weight:600; margin-bottom:4px;">Confirm New Password *</label>
            <input type="password" name="confirm_password" required style="width:100%; padding:8px;">
        </div>
        <div style="display:flex; gap:8px;">
            <button class="btn btn-primary" type="submit">Update Password</button>
            <a class="btn" href="{% url 'core:profile' %}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
